<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSense</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>CodeSense</h1>
        <p>Alt+Space ile AI tamamlama, buton ile seçili kodu optimize et.</p>
      </header>

      <section class="editor-panel">
        <label for="editor">Kod Editörü</label>
        <textarea id="editor" spellcheck="false" placeholder="Kodunuzu yazın..."></textarea>
      </section>

      <div class="actions">
        <button id="optimizeBtn" type="button">AI ile Optimize Et</button>
      </div>

      <section class="status-panel">
        <strong>Durum:</strong>
        <span id="status">Hazır</span>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
